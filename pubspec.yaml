name: jp_disaster_blocker_workspace
description: Melos workspace root for jp-disaster-blocker.
publish_to: none

environment:
  sdk: ^3.11.0

# Dart native workspace + melos 7.x package paths
workspace:
  - apps/*
  - packages/*
  - tools/*

dev_dependencies:
  melos: ^7.5.1
  very_good_analysis: ^7.0.0

melos:
  scripts:
    test:
      run: flutter test --reporter=compact
      exec:
        concurrency: 1
        failFast: false
      description: Run all tests

    lint:
      run: flutter analyze --no-fatal-infos
      exec:
        concurrency: 1
      description: Run static analysis on all packages

    validate-deps:
      run: dart run tools/dependency_validator/bin/validate.dart
      description: Check that feature_* packages do not directly depend on each other

    format:
      run: dart format . --set-exit-if-changed
      exec:
        concurrency: 1
      description: Check code formatting
