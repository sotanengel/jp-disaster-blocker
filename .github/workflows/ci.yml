name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Supply Chain Security ─────────────────────────────────────────────────
  guard-npm:
    name: Takumi Guard (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1.1.1
      - name: Verify Takumi Guard blocks malicious package
        run: |
          npm install @panda-guard/test-malicious && echo "ERROR: should have been blocked" && exit 1 || echo "Blocked as expected"

  guard-pypi:
    name: Takumi Guard (PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: flatt-security/setup-takumi-guard-pypi@733047c120b6377fa05fb77f714df8d8cd3a41a9 # v1.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify Takumi Guard blocks malicious package
        run: |
          pip install panda-guard-test-malicious && echo "ERROR: should have been blocked" && exit 1 || echo "Blocked as expected"

  # ─── Flutter Tests ─────────────────────────────────────────────────────────
  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - name: Install melos
        run: dart pub global activate melos
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Run tests
        run: melos run test
      - name: Run lint
        run: melos run lint
      - name: Validate feature dependencies
        run: dart run tools/dependency_validator/bin/validate.dart
